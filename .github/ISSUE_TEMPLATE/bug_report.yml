name: Bug report
description: Report a problem with cf-pages-relay
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: TARGET_URL (redacted)
      description: The upstream you were relaying to. Hide any secrets / tokens.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set TARGET_URL to ...
        2. Request /foo
        3. See ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
